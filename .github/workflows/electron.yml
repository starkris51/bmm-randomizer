name: Build electron app

on:
  workflow_dispatch:
  workflow_call:
  push:
    tags:
      - "v*"

permissions:
  # Needed so GITHUB_TOKEN can create the release and upload assets
  contents: write

jobs:
  build-electron-app:
    runs-on: ${{ matrix.os }}
    env:
      # GitHub token, automatically provided to the action
      # (No need to define this secret in the repo settings)
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Electron and electron-builder download binaries from GitHub releases,
      # which occasionally returns 5xx. Cache them and retry the install.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm install && exit 0
            echo "pnpm install failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Build for production
        run: pnpm build:electron
        env:
          NUXT_PUBLIC_APPLICATION_INSIGHTS: ${{ vars.NUXT_PUBLIC_APPLICATION_INSIGHTS }}

      # Publishes to a draft GitHub release when triggered by a tag, otherwise only builds
      - name: Package the Electron app
        run: pnpm package:electron --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            dist-app/BMM*
            dist-app/*.deb
          if-no-files-found: error
